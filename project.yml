name: Cruft
options:
  bundleIdPrefix: xyz.phpz.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  Cruft:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: Cruft
        PRODUCT_BUNDLE_IDENTIFIER: xyz.phpz.app.cruft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 侧边栏选中高亮走系统强调色，SwiftUI 的 .tint 管不到它。不设这个
        # 资源目录条目，高亮就是系统默认的蓝，和一身珊瑚橙的界面对不上。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Cruft
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Cruft 仅在你主动扫描时读取桌面上的安装包。"
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Cruft 仅在你主动选择项目扫描时读取文稿目录。"
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Cruft 仅在你主动扫描时读取下载目录中的安装包。"
        INFOPLIST_KEY_NSSystemAdministrationUsageDescription: "Cruft 需要完全磁盘访问来检查开发缓存、日志、应用残留和废纸篓。"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  CruftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Cruft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
