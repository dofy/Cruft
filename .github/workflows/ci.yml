name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: >-
          xcodebuild test
          -project Cruft.xcodeproj
          -scheme Cruft
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      # Guards en / zh-Hans / zh-Hant coverage in the String Catalogs and the
      # no-hardcoded-Chinese rule.
      - name: Check String Catalogs
        run: ./Scripts/check-localization.sh
